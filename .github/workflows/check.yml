name: check

on:
  schedule:
    # A cada 10 min. O cron do Actions nao aceita intervalo sorteado, entao o
    # jitter abaixo espalha o horario. Para intervalo aleatorio de verdade,
    # use ./run.sh --loop numa maquina sua.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      notify_current:
        description: "Enviar o estoque atual ao ntfy"
        required: false
        type: boolean
        default: false

concurrency:
  group: abecmed-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Espalha o horario dentro da janela de 10 min.
      - name: Jitter
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 300))

      - name: Rodar
        env:
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.notify_current }}" = "true" ]; then
            python3 bot.py --notify-current
          else
            python3 bot.py
          fi

      - name: Salvar estado
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
