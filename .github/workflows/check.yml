name: check

on:
  schedule:
    # A cada 10 min. O cron do Actions nao aceita intervalo sorteado, entao o
    # jitter abaixo espalha o horario. Para intervalo aleatorio de verdade,
    # use ./run.sh --loop numa maquina sua.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      notify_current:
        description: "Enviar o estoque atual ao ntfy"
        required: false
        type: boolean
        default: false

concurrency:
  group: abecmed-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    # O estado compartilhado pertence a main; nao publicar a partir de PRs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Esperar antes do checkout evita coletar usando um estado antigo.
      - name: Jitter
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 300))

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rodar
        id: monitor
        env:
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.notify_current }}" = "true" ]; then
            python3 bot.py --notify-current
          else
            python3 bot.py
          fi

      - name: Salvar estado
        # Persiste tambem o aviso de falha, sem esconder o erro da etapa Rodar.
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        run: bash scripts/save-state.sh
