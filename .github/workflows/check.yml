name: check

on:
  schedule:
    # Mantem 6 consultas/hora solicitadas, fora do inicio da hora e dos multiplos
    # de 10 mais concorridos. O GitHub ainda pode atrasar ou descartar disparos.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      notify_current:
        description: "Enviar o estoque atual ao ntfy"
        required: false
        type: boolean
        default: false

concurrency:
  group: abecmed-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    # O estado compartilhado pertence a main; nao publicar a partir de PRs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rodar
        id: monitor
        env:
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.notify_current }}" = "true" ]; then
            python3 bot.py --notify-current
          else
            python3 bot.py
          fi

      - name: Salvar estado
        # Persiste tambem o aviso de falha, sem esconder o erro da etapa Rodar.
        if: ${{ !cancelled() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        run: bash scripts/save-state.sh

      # Diagnostico depois da consulta para nao atrasar o aviso de estoque.
      # Mede disparos registrados, nao e um vigia independente do agendador.
      - name: Diagnosticar intervalo do agendamento
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.monitor.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_schedule.py
