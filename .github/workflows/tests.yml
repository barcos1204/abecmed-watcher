name: tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Testes offline (sem CPF, ntfy ou consulta de estoque)
        run: python3 -m unittest discover -s tests -v
